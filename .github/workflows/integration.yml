name: Integration - Compile Check

run-name: Integration | ${{ github.event_name }} | ${{ github.ref_name }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Validate and Compile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Validate Maven configuration
        run: mvn -B -ntp validate --file pom.xml

      - name: Compile application
        run: mvn -B -ntp clean compile --file pom.xml

      - name: Verify compiled classes
        shell: bash
        run: |
          if [ ! -d "target/classes" ]; then
            echo "ERROR: Folder target/classes tidak ditemukan."
            exit 1
          fi

          CLASS_COUNT=$(find target/classes -type f -name "*.class" | wc -l)
          echo "Jumlah file class yang berhasil dikompilasi: $CLASS_COUNT"

          if [ "$CLASS_COUNT" -eq 0 ]; then
            echo "ERROR: Tidak ada file .class yang dihasilkan."
            exit 1
          fi

          echo "Integration berhasil: source code dapat dikompilasi."
